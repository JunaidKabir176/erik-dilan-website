    body.gallery-page {

      letter-spacing: 0.18em;
      color: #c4b5fd;
      margin: 0 0 8px;
    }

    .gallery-title {
      margin: 0 0 10px;
      font-size: clamp(2.1rem, 3.8vw, 2.7rem);

      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .gallery-lede {

      color: #e5e7eb;
      font-size: 0.98rem;
      line-height: 1.7;
    }

    .gallery-section {

    }

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  align-items: start;
}

.gallery-card {
  align-self: start;
}
    /* ✅ KEY CHANGE: let images define tile height (no forced aspect ratio) */
    .gallery-thumb {
      width: 100%;
      padding: 10px;
      background: rgba(0, 18, 41, 0.35);
    }

    /* ✅ KEY CHANGE: no cropping; image fits within tile */
    .gallery-thumb img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.12);
    }

    .gallery-meta {
      padding: 10px 12px 14px;
      border-top: 1px solid rgba(191, 219, 254, 0.15);
    }

    .gallery-caption {
      margin: 0;
      color: #e5e7eb;
      font-size: 0.92rem;
      line-height: 1.45;
    }

    /* Simple modal viewer */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      z-index: 200;
    }

    .lightbox.is-open {
      display: flex;
    }

    .lightbox-dialog {
      width: min(1100px, 100%);
      border-radius: 18px;
      border: 1px solid rgba(191, 219, 254, 0.25);
      background: rgba(0, 18, 41, 0.75);
      overflow: hidden;
      box-shadow: 0 22px 65px rgba(0, 0, 0, 0.75);
      position: relative;
    }

    /* ✅ Always show entire image in lightbox */
    .lightbox-img {
      width: 100%;
      height: auto;
      max-height: 78vh;
      display: block;
      object-fit: contain;
      background: rgba(0, 0, 0, 0.25);
    }

    .lightbox-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      color: #e5e7eb;
      font-size: 0.92rem;
      border-top: 1px solid rgba(191, 219, 254, 0.18);
    }

    .lightbox-caption {
      margin: 0;
      color: #cbd5f5;
    }

    .lightbox-btn {
      border: 1px solid rgba(191, 219, 254, 0.35);
      background: rgba(0, 18, 41, 0.35);
      color: #f9fafb;
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .lightbox-btn:hover {
      background: rgba(0, 18, 41, 0.55);
    }

    .lightbox-actions {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      flex: 0 0 auto;
    }

    .gallery-open {
      display: block;
      text-decoration: none;
    }

    @media (max-width: 900px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }
      .lightbox-img {
        max-height: 72vh;
      }
    }

  <script>
    // Navbar injection
    fetch("navbar.html")
      .then((r) => r.text())
      .then((html) => {
        document.getElementById("site-header").innerHTML = html;

        const navToggle = document.querySelector(".nav-toggle");
        const mainMenu = document.getElementById("primary-nav");

        if (navToggle && mainMenu) {
          navToggle.addEventListener("click", () => {
            const isOpen = mainMenu.classList.toggle("is-open");
            navToggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
            document.body.classList.toggle("menu-open", isOpen);
          });
        }

        const links = document.querySelectorAll(".main-menu .nav-link");
        const path = window.location.pathname.split("/").pop() || "index.html";
        links.forEach((link) => {
          if (link.getAttribute("href") === path) link.classList.add("active");
        });
      })
      .catch((err) => console.error("Error loading navbar:", err));

    // Lightbox behavior
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const lightboxCaption = document.getElementById("lightbox-caption");
    const btnClose = document.getElementById("lightbox-close");
    const btnPrev = document.getElementById("lightbox-prev");
    const btnNext = document.getElementById("lightbox-next");

    const items = Array.from(document.querySelectorAll(".gallery-open"));
    let currentIndex = -1;

    function openAt(index) {
      if (index < 0 || index >= items.length) return;
      currentIndex = index;

      const el = items[index];
      const src = el.getAttribute("data-src");
      const cap = el.getAttribute("data-caption") || "";

      lightboxImg.src = src;
      lightboxImg.alt = cap || "Gallery image";
      lightboxCaption.textContent = cap;

      lightbox.classList.add("is-open");
      lightbox.setAttribute("aria-hidden", "false");
    }

    function closeLightbox() {
      lightbox.classList.remove("is-open");
      lightbox.setAttribute("aria-hidden", "true");
      lightboxImg.src = "";
      lightboxCaption.textContent = "";
      currentIndex = -1;
    }

    function prev() {
      if (currentIndex === -1) return;
      openAt((currentIndex - 1 + items.length) % items.length);
    }

    function next() {
      if (currentIndex === -1) return;
      openAt((currentIndex + 1) % items.length);
    }

    items.forEach((el, idx) => {
      el.addEventListener("click", (e) => {
        e.preventDefault();
        openAt(idx);
      });
    });

    btnClose.addEventListener("click", closeLightbox);
    btnPrev.addEventListener("click", prev);
    btnNext.addEventListener("click", next);

    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener("keydown", (e) => {
      if (!lightbox.classList.contains("is-open")) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") prev();
      if (e.key === "ArrowRight") next();
    });
  </script>
